name: Update Nara data

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Nara data
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: node update-data.js
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nara-data.json
          git diff --cached --quiet || git commit -m "Update Nara bid data"
          git push
